name: Fetch ENTSO-E day-ahead prices
on:
  schedule:
    # ENTSO-E day-ahead prices for NL are typically published by ~13:00 CET
    # the day before delivery. Run once in the afternoon (13:30 UTC) to
    # pick up tomorrow's prices as soon as they land.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Optional: backfill the last N days instead of the normal today/tomorrow fetch (leave empty for normal run)"
        required: false
        type: string
permissions:
  contents: write  # needed to commit entsoe_prices.db back to the repo
jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging if a runner never gets acquired
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch tomorrow's prices
        if: ${{ github.event.inputs.backfill_days == '' }}
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python entsoe_prices.py --tomorrow --store
      - name: Fetch today's prices too (backfill in case tomorrow wasn't published yet)
        if: ${{ github.event.inputs.backfill_days == '' }}
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python entsoe_prices.py --store
      - name: Manual backfill (N days, from workflow_dispatch input)
        if: ${{ github.event.inputs.backfill_days != '' }}
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python entsoe_prices.py --backfill-days ${{ github.event.inputs.backfill_days }}
      - name: Export prices to CSV
        run: |
          python - <<'PY'
          import sqlite3
          import csv
          from pathlib import Path
          conn = sqlite3.connect("entsoe_prices.db")
          rows = conn.execute(
              "SELECT date, hour, minute, timestamp_utc, price_eur_per_mwh, fetched_at "
              "FROM entsoe_prices ORDER BY date, hour, minute"
          ).fetchall()
          conn.close()
          Path("entsoe_prices_export.csv").write_text("")
          with open("entsoe_prices_export.csv", "w", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["date", "hour", "minute", "timestamp_utc", "price_eur_per_mwh", "fetched_at"])
              writer.writerows(rows)
          PY
      - name: Upload CSV as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: entsoe-prices-csv
          path: entsoe_prices_export.csv
          retention-days: 30
      - name: Export JSON for the dashboard (docs/)
        run: python export_data.py
      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entsoe_prices.db docs/data/entsoe.json docs/data/ttf.json
          git diff --staged --quiet || git commit -m "Update ENTSO-E prices $(date -u +%Y-%m-%d)"

          # The push can be rejected if main moved since checkout (e.g. a
          # manual push landed in the meantime). Retry a few times, always
          # keeping this run's freshly-fetched files on conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), fetching and retrying..."
            git fetch origin main
            git merge -X ours --no-edit origin/main || {
              git checkout --ours entsoe_prices.db docs/data/entsoe.json docs/data/ttf.json
              git add entsoe_prices.db docs/data/entsoe.json docs/data/ttf.json
              git commit --no-edit
            }
            sleep $((attempt * 3))
          done
          echo "Failed to push after multiple attempts."
          exit 1

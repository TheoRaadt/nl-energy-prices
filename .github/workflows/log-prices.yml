name: Log NL day-ahead electricity prices

on:
  schedule:
    - cron: "15 1 * * *"  # 01:15 UTC daily; always past midnight in Europe/Amsterdam year-round
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  log-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python log_prices.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.db
          git diff --cached --quiet || git commit -m "Log prices for $(date -u +%F)"
          git push

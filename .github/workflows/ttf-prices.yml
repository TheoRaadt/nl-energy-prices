name: Fetch TTF gas prices

on:
  schedule:
    # TTF=F is a continuously-traded future; Yahoo's delayed quote settles
    # after European market close. Run once in the evening (20:00 UTC).
    - cron: "0 20 * * *"
  workflow_dispatch:


permissions:
  contents: write

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch and store TTF prices
        run: python ttf_prices.py --days 5 --store

      - name: Export CSV
        run: |
          python -c "
          import sqlite3, csv
          conn = sqlite3.connect('ttf_prices.db')
          rows = conn.execute('SELECT date, open, high, low, close, volume, ticker, fetched_at FROM ttf_prices ORDER BY date').fetchall()
          with open('ttf_prices.csv', 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['date', 'open', 'high', 'low', 'close', 'volume', 'ticker', 'fetched_at'])
              w.writerows(rows)
          "

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ttf_prices.db
          git diff --staged --quiet || git commit -m "Update TTF prices $(date -u +%Y-%m-%d)"
          git push

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v7
        with:
          name: ttf-prices-csv
          path: ttf_prices.csv
          retention-days: 30
